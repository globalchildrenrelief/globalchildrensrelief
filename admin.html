const app = initializeApp(firebaseConfig);  
const db = getFirestore(app);  
const docRef = doc(db, "site", "main");  
  
window.login = function() {  
  if (document.getElementById("adminPassword").value === "1234") {  
    document.getElementById("adminPanel").style.display = "block";  
    document.getElementById("loginTitle").style.display = "none";  
    document.getElementById("adminPassword").style.display = "none";  
    document.getElementById("loginBtn").style.display = "none";  
    loadData();  
  } else {  
    alert("Wrong password");  
  }  
};  
  
async function loadData() {  
  try {  
    const docSnap = await getDoc(docRef);  
    if (docSnap.exists()) {  
      const d = docSnap.data();  
      document.getElementById("title").value = d.title || "";  
      document.getElementById("story").value = d.story || "";  
      document.getElementById("goal").value = d.goal || "";  
      document.getElementById("min").value = d.min || "";  
      document.getElementById("max").value = d.max || "";  
      document.getElementById("image").value = d.image || "";  
      document.getElementById("report").value = d.report || "";  
      document.getElementById("share").value = d.share || "";  
    }  
  } catch (e) {  
    alert("Error loading data");  
  }  
}  
  
// Convert chosen file to link string  
window.previewFile = function(targetId, fileInputId) {  
  const file = document.getElementById(fileInputId).files[0];  
  if (file) {  
    const reader = new FileReader();  
    reader.onload = function(e) {  
      document.getElementById(targetId).value = e.target.result;  
    };  
    reader.readAsDataURL(file);  
  }  
};  
  
window.save = async function() {  
  try {  
    await setDoc(docRef, {  
      title: document.getElementById("title").value,  
      story: document.getElementById("story").value,  
      goal: document.getElementById("goal").value,  
      min: document.getElementById("min").value,  
      max: document.getElementById("max").value,  
      image: document.getElementById("image").value,  
      report: document.getElementById("report").value,  
      share: document.getElementById("share").value  
    }, { merge: true });  
  
    alert("Saved successfully!");  
  } catch (e) {  
    alert("Error: " + e.message);  
  }  
};
