<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Global Children Relief</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .file-input-box {
            margin-top: 6px;
            padding: 8px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover {
            background: #15803d;
        }
        #loginSection {
            display: block;
        }
        #adminContent {
            display: none;
        }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .status-success {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        .status-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection">
            <h2>Admin Security Login</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 12px;">Enter your admin passcode to proceed to the editor.</p>
            <div class="form-group">
                <label>Passcode</label>
                <input type="password" id="adminPassword" placeholder="Enter password (default is: 1234)">
            </div>
            <button onclick="checkPassword()">Log In</button>
            <p id="loginError" style="color: #dc2626; font-size: 12px; display: none; margin-top: 8px;">Incorrect password. Try again.</p>
        </div>

        <div id="adminContent">
            <h2>Campaign Editor</h2>
            
            <div style="font-size: 12px; color: #065f46; background: #ecfdf5; padding: 10px; border-radius: 8px; margin-bottom: 16px;">
                💡 <strong>How to update pictures and reports:</strong> Select an image directly from your phone/computer, or paste a link from an image hosting site into the URL fields below.
            </div>

            <div class="form-group">
                <label>Campaign Title</label>
                <input type="text" id="editTitle">
            </div>
            <div class="form-group">
                <label>Campaign Story</label>
                <textarea id="editStory" rows="5"></textarea>
            </div>
            <div class="form-group">
                <label>Goal Amount ($)</label>
                <input type="number" id="editGoal">
            </div>
            <div class="form-group">
                <label>Min Donation ($)</label>
                <input type="number" id="editMin">
            </div>
            <div class="form-group">
                <label>Max Donation ($)</label>
                <input type="number" id="editMax">
            </div>
            
            <div class="form-group">
                <label>Main Campaign Image</label>
                <input type="url" id="editImage" placeholder="Or paste image URL">
                <div class="file-input-box">
                    <input type="file" id="editImageFile" accept="image/*">
                </div>
            </div>
            <div class="form-group">
                <label>Medical Report Image</label>
                <input type="url" id="editReport" placeholder="Or paste report image URL">
                <div class="file-input-box">
                    <input type="file" id="editReportFile" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label>Share Message</label>
                <input type="text" id="editShare">
            </div>

            <button onclick="saveChanges()">Save Changes</button>
            <div id="statusMsg" class="status"></div>
            
            <button style="background: #111827; margin-top: 12px;" onclick="logout()">Log Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsS48tgOniIUsJSQT8qyDgZSXPT-Jivrk",
            authDomain: "globalchildrenrelief-9746a.firebaseapp.com",
            projectId: "globalchildrenrelief-9746a",
            storageBucket: "globalchildrenrelief-9746a.firebasestorage.app",
            messagingSenderId: "218937278830",
            appId: "1:218937278830:web:578a126f4500a8d72d817f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const docRef = doc(db, "site", "main");

        window.checkPassword = function() {
            const pass = document.getElementById("adminPassword").value;
            if (pass === "1234") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("adminContent").style.display = "block";
                loadCurrentData();
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        };

        window.logout = function() {
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("adminContent").style.display = "none";
            document.getElementById("adminPassword").value = "";
            document.getElementById("loginError").style.display = "none";
        };

        async function loadCurrentData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("editTitle").value = data.title || "";
                    document.getElementById("editStory").value = data.story || "";
                    document.getElementById("editGoal").value = data.goal || "";
                    document.getElementById("editMin").value = data.min || "";
                    document.getElementById("editMax").value = data.max || "";
                    document.getElementById("editImage").value = data.image || "";
                    document.getElementById("editReport").value = data.report || "";
                    document.getElementById("editShare").value = data.share || "";
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        window.saveChanges = async function() {
            const status = document.getElementById("statusMsg");
            status.style.display = "none";
            status.innerText = "Saving changes...";
            status.className = "status status-success";
            status.style.display = "block";

            try {
                let mainImageUrl = document.getElementById("editImage").value;
                let reportImageUrl = document.getElementById("editReport").value;

                // Handle Main Image file upload if selected
                const imageFile = document.getElementById("editImageFile").files[0];
                if (imageFile) {
                    status.innerText = "Uploading Main Image...";
                    const imageRef = ref(storage, 'campaigns/main_image.jpg');
                    await uploadBytes(imageRef, imageFile);
                    mainImageUrl = await getDownloadURL(imageRef);
                }

                // Handle Medical Report file upload if selected
                const reportFile = document.getElementById("editReportFile").files[0];
                if (reportFile) {
                    status.innerText = "Uploading Medical Report...";
                    const reportRef = ref(storage, 'campaigns/report_image.jpg');
                    await uploadBytes(reportRef, reportFile);
                    reportImageUrl = await getDownloadURL(reportRef);
                }

                await setDoc(docRef, {
                    title: document.getElementById("editTitle").value,
                    story: document.getElementById("editStory").value,
                    goal: document.getElementById("editGoal").value,
                    min: document.getElementById("editMin").value,
                    max: document.getElementById("editMax").value,
                    image: mainImageUrl,
                    report: reportImageUrl,
                    share: document.getElementById("editShare").value
                }, { merge: true });

                status.innerText = "Content and images updated successfully!";
                status.className = "status status-success";
                loadCurrentData();
            } catch (error) {
                console.error("Error updating:", error);
                status.innerText = "Error saving. Make sure your Firebase storage rules are public.";
                status.className = "status status-error";
            }
        };
    </script>
</body>
</html>
